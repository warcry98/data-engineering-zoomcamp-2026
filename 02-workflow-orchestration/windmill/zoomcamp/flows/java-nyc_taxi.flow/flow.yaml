summary: java-flow
description: ""

value:
  modules:
    - id: trigger
      summary: Every 30 seconds
      value:
        type: trigger
        trigger:
          type: cron
          cron: "*/30 * * * * *"

    - id: month
      summary: Get Month
      value:
        type: script
        path: u/admin/java-nyc_taxi/get-months
        is_trigger: false
        input_transforms:
          year:
            type: javascript
            expr: flow_input.year

schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    year:
      type: string
      default: "2019"
      enum: ["2019", "2020", "2021"]
  required: [year]

ws_error_handler_muted: false